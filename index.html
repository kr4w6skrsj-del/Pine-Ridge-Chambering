<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pine Ridge Chamber">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="app.css">
  <title>Pine Ridge Chamber</title>
</head>
<body>
  <header class="appbar">
    <button class="btn drawerBtn" id="drawerBtn" aria-label="Open saved chambers">☰</button>
    <div class="brand">
      <div class="logo">PR</div>
      <div class="brandtext"><b>Pine Ridge Chamber</b><span>iPad chamber worksheet • V0.1</span></div>
    </div>
    <div class="spacer"></div>
    <div class="toolbar">
      <button class="btn primary" id="newBtn">＋ New</button>
      <button class="btn" id="dupBtn">Duplicate</button>
      <button class="btn" id="printBtn">Print / PDF</button>
      <button class="btn secondaryHide" id="backupBtn">Backup</button>
      <button class="btn secondaryHide" id="importBtn">Import</button>
      <button class="btn danger secondaryHide" id="deleteBtn">Delete</button>
      <input type="file" accept=".json,application/json" id="importFile" hidden>
    </div>
  </header>

  <main class="main">
    <aside class="sidebar" id="sidebar">
      <div class="sideHead">
        <div style="display:flex;align-items:center;gap:8px">
          <h2 style="flex:1">Saved Chambers</h2>
          <button class="btn drawerBtn" id="closeDrawer">✕</button>
        </div>
        <input class="search" id="search" placeholder="Search chambers…">
      </div>
      <div class="chamberList" id="chamberList"></div>
    </aside>

    <section class="workspaceCard">
      <div class="details">
        <div class="fieldGroup"><label>Chamber Name</label><input id="chamberName" placeholder="e.g. 6.5 Creedmoor"></div>
        <div class="fieldGroup"><label>Cartridge</label><input id="cartridge"></div>
        <div class="fieldGroup"><label>Reamer / Job Customer</label><input id="customer"></div>
        <div class="fieldGroup"><label>Action</label><input id="action"></div>
        <div class="fieldGroup"><label>Action SN#</label><input id="actionSn"></div>
        <div class="fieldGroup"><label>Barrel</label><input id="barrel"></div>
        <div class="fieldGroup"><label>Barrel SN#</label><input id="barrelSn"></div>
        <div class="fieldGroup">
          <label>How to use</label>
          <div style="font-size:13px;color:#66717f;padding:8px 0">Tap a red box, type the value, then use Next.</div>
        </div>
      </div>

      <div class="sheetWrap">
        <div class="sheet" id="sheet" aria-label="Pine Ridge chamber worksheet"></div>
      </div>

      <div class="statusbar">
        <span id="savedStatus">Autosaved locally</span>
        <span>Tip: Duplicate a chamber before making a variant.</span>
      </div>
    </section>
  </main>

  <div class="quickEditor" id="quickEditor">
    <div class="quickLabel" id="quickLabel">Measurement</div>
    <input class="quickInput" id="quickInput" autocomplete="off">
    <button class="qbtn" id="quickPrev" aria-label="Previous field">‹</button>
    <button class="qbtn" id="quickNext" aria-label="Next field">›</button>
    <button class="qbtn done" id="quickDone">Done</button>
  </div>
  <div class="toast" id="toast"></div>

  <script src="fields.js"></script>
  <script src="app.js"></script>
</body>
</html>
